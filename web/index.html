<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111e" />
    <title>PuckNexus | The Connected Hockey Platform</title>
    <link rel="stylesheet" href="./styles.css?v=beta-stage-1-2" />
  </head>
  <body>
    <div class="auth-screen" id="authScreen" hidden></div>
    <div class="app-shell" id="appShell" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark" id="tenantMark">PN</div>
          <div>
            <div class="brand-title-wrap">
              <strong id="tenantName">PuckNexus</strong>
              <span class="beta-badge">BETA</span>
            </div>
            <span id="tenantSeasonLabel">The Connected Hockey Platform</span>
          </div>
        </div>
        <button class="mobile-close" id="closeSidebar" aria-label="Close navigation">×</button>
        <nav class="nav" aria-label="Primary navigation">
          <p class="nav-label" data-section="overview">Overview</p>
          <button class="nav-item active" data-section="overview" data-view="command" aria-current="page"><span>⌂</span> Home</button>
          <button class="nav-item" data-section="overview" data-view="team"><span>🛡</span> Team</button>
          <button class="nav-item" data-section="overview" data-view="schedule"><span>◷</span> Schedule</button>
          <button class="nav-item" data-section="overview" data-view="games"><span>▣</span> Games</button>

          <p class="nav-label" data-section="analytics">Analytics & Roster</p>
          <button class="nav-item" data-section="analytics" data-view="players"><span>♙</span> Players</button>
          <button class="nav-item" data-section="analytics" data-view="stats"><span>↗</span> Stats</button>
          <button class="nav-item" data-section="analytics" data-view="film"><span>🎬</span> Film Room</button>
          <button class="nav-item" data-section="analytics" data-view="scouting"><span>⌁</span> Scouting</button>
          <button class="nav-item" data-section="analytics" data-view="reports"><span>▤</span> Reports</button>

          <p class="nav-label" data-section="coaching">Coaching & Dev</p>
          <button class="nav-item" data-section="coaching" data-view="development"><span>📈</span> Player Development</button>
          <button class="nav-item" data-section="coaching" data-view="coaching"><span>📋</span> Coaching Tools</button>
          <button class="nav-item" data-section="coaching" data-view="management"><span>⚙</span> Team Management</button>

          <p class="nav-label" data-section="system">System</p>
          <button class="nav-item" data-section="system" data-view="support"><span>?</span> Support</button>
          <button class="nav-item" data-section="system" data-view="admin"><span>♙</span> Admin</button>
          <button class="nav-item" data-section="system" data-view="settings"><span>⚙</span> Settings</button>
        </nav>
        <div class="sidebar-foot">
          <div class="sidebar-user" id="sidebarUser"></div>
          <div class="sample-badge"><span class="pulse"></span> PuckNexus Beta Workspace</div>
          <small id="teamStatus">Supabase session active</small>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="mobile-menu" id="openSidebar" aria-label="Open navigation">☰</button>
          <div class="crumbs"><span>PuckNexus Beta</span><b>/</b><strong id="viewCrumb">Home</strong></div>
          <div class="top-actions">
            <div id="organizationSwitcher" class="organization-switcher" hidden></div>
            <div id="teamSwitcher" class="team-switcher" hidden></div>
            <div id="seasonSwitcher" class="season-switcher" hidden></div>
            <span id="workspaceRole" class="workspace-indicator">No workspace</span>
            <span id="workspacePlan" class="workspace-indicator">No plan</span>
            <span class="season-pill" id="seasonPill">Live season <i></i></span>
            <button class="icon-button" aria-label="Notifications" title="Notifications are not enabled in this beta">♢</button>
            <div class="user-menu"><div class="avatar" id="userAvatar">JK</div><span id="userName">User</span><b>⌄</b></div>
          </div>
        </header>

        <div id="app"></div>

        <footer class="footer-note"><span id="tenantFooter">PuckNexus</span> · Connected Hockey Platform <span class="beta-badge-inline">BETA</span></footer>
      </main>
    </div>
    <div class="scrim" id="scrim"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./permissions.js?v=live-auth"></script>
    <script src="./platform-branding.js?v=pucknexus-1"></script>
    <script src="./team-context.js?v=multi-team-1"></script>
    <script src="./season-context.js?v=beta-stage-1-1"></script>
    <script src="./organization-context.js?v=login-fix-2"></script>
    <script src="./workspace-access.js?v=stage-e-1"></script>
    <script src="./entitlements.js?v=login-fix-2"></script>
    <script src="./roster-management.js?v=stage-f-1"></script>
    <script src="./media-storage.js?v=stage-f-2"></script>
    <script src="./support-reporting.js?v=stage-f-2"></script>
    <script src="./app.js?v=beta-stage-1-2"></script>
  </body>
</html>
