<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111e" />
    <title>PuckNexus | The Connected Hockey Platform</title>
    <link rel="stylesheet" href="./styles.css?v=live-auth" />
  </head>
  <body>
    <div class="auth-screen" id="authScreen" hidden></div>
    <div class="app-shell" id="appShell" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark" id="tenantMark">PN</div>
          <div>
            <strong id="tenantName">PuckNexus</strong>
            <span id="tenantSeasonLabel">The Connected Hockey Platform</span>
          </div>
        </div>
        <button class="mobile-close" id="closeSidebar" aria-label="Close navigation">×</button>
        <nav class="nav" aria-label="Primary navigation">
          <p class="nav-label">Workspace</p>
          <button class="nav-item active" data-view="command" aria-current="page"><span>⌂</span> Command Center</button>
          <button class="nav-item" data-view="schedule"><span>◷</span> Schedule</button>
          <button class="nav-item" data-view="stats"><span>↗</span> Team Stats</button>
          <button class="nav-item" data-view="players"><span>♙</span> Player Profiles</button>
          <button class="nav-item" data-view="games"><span>▣</span> Game Center</button>
          <button class="nav-item" data-view="scouting"><span>⌁</span> Scouting</button>
          <button class="nav-item" data-view="reports"><span>▤</span> Coach Reports</button>
          <p class="nav-label">Team setup</p>
          <button class="nav-item" data-view="admin"><span>♙</span> Admin</button>
          <button class="nav-item" data-view="settings"><span>⚙</span> Settings</button>
        </nav>
        <div class="sidebar-foot">
          <div class="sample-badge"><span class="pulse"></span> Live team workspace</div>
          <small id="teamStatus">Supabase session active</small>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="mobile-menu" id="openSidebar" aria-label="Open navigation">☰</button>
          <div class="crumbs"><span>Team Hub</span><b>/</b><strong id="viewCrumb">Command Center</strong></div>
          <div class="top-actions">
            <div id="teamSwitcher" class="team-switcher" hidden></div>
            <div id="seasonSwitcher" class="season-switcher" hidden></div>
            <span class="season-pill" id="seasonPill">Live season <i></i></span>
            <button class="icon-button" aria-label="Notifications">♢<em>3</em></button>
            <div class="user-menu"><div class="avatar" id="userAvatar">JK</div><span id="userName">Justin Kostosky</span><b>⌄</b></div>
          </div>
        </header>

        <div id="app"></div>

        <footer class="footer-note"><span id="tenantFooter">PuckNexus</span> · Secure team workspace <span>Supabase-authenticated workspace</span></footer>
      </main>
    </div>
    <div class="scrim" id="scrim"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./permissions.js?v=live-auth"></script>
    <script src="./platform-branding.js?v=pucknexus-1"></script>
    <script src="./team-context.js?v=multi-team-1"></script>
    <script src="./season-context.js?v=multi-team-1"></script>
    <script src="./app.js?v=multi-team-1"></script>
  </body>
</html>
