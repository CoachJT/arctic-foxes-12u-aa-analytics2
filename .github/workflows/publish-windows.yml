name: Build and Publish Windows Update

on:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'index.html'
      - 'main.js'
      - 'preload.js'
      - 'analytics.js'
      - 'release-ui.js'
      - 'package-lock.json'
      - 'tests/**'
      - '.github/workflows/publish-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        run: npm install

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "App version: $version"

      - name: Validate release source
        shell: pwsh
        run: npm test

      - name: Ensure release tag exists
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          git fetch --tags
          if (-not (git tag -l $tag)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $tag
            git push origin $tag
          } else {
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne "${{ github.sha }}") {
              throw "Tag $tag belongs to another commit; refusing to overwrite a previous release."
            }
          }

      - name: Build update files
        shell: pwsh
        run: npx electron-builder --win nsis --publish never

      - name: Ensure GitHub release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --title "${{ steps.version.outputs.version }}" --notes "Arctic Foxes Analytics ${{ steps.version.outputs.version }}"
          } else {
            Write-Host "Release $tag already exists."
          }
          exit 0

      - name: Upload updater files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release upload $tag "dist/latest.yml" "dist/*.exe" "dist/*.blockmap" --repo "${{ github.repository }}"

      - name: Publish summary
        shell: pwsh
        run: |
          "### Arctic Foxes ${{ steps.version.outputs.version }} published ✅" >> $env:GITHUB_STEP_SUMMARY
          "The Windows installer, blockmap, and latest.yml were uploaded by GitHub Actions." >> $env:GITHUB_STEP_SUMMARY
