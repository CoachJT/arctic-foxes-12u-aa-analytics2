name: Build and Publish Windows Update

on:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'index.html'
      - 'main.js'
      - 'preload.js'
      - 'analytics.js'
      - 'release-ui.js'
      - 'interface.js'
      - 'command-model.js'
      - 'command-ui.js'
      - 'command.css'
      - 'film-workspace.js'
      - 'film-follow*'
      - 'film-breaks.js'
      - 'schedule-view*'
      - 'scoreboard-clock.js'
      - 'player-tracker.js'
      - 'player-follow-model.js'
      - 'player-detector*.js'
      - 'ice-time.js'
      - 'opponent-*.js'
      - 'scoresheet-ocr.ps1'
      - 'player-learning*.js'
      - 'scouting*'
      - 'interface-model.js'
      - 'interface.css'
      - 'toi-engine.js'
      - 'crossing-detector.js'
      - 'toi-ui.js'
      - 'toi.css'
      - 'stats-import.js'
      - 'stats-import-ui.js'
      - 'vendor/**'
      - 'package-lock.json'
      - 'tests/**'
      - '.github/workflows/publish-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "App version: $version"

      - name: Validate release source
        shell: pwsh
        run: npm test

      - name: Snapshot package manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash package.json -Algorithm SHA256).Hash
          "manifest_hash=$hash" >> $env:GITHUB_ENV

      - name: Ensure release tag exists
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          git fetch --tags
          if (-not (git tag -l $tag)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $tag
            git push origin $tag
          } else {
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne "${{ github.sha }}") {
              throw "Tag $tag belongs to another commit; refusing to overwrite a previous release."
            }
          }

      - name: Build update files
        shell: pwsh
        run: node scripts/guarded-build.cjs --win nsis --publish never

      - name: Verify package manifest
        shell: pwsh
        run: |
          $after = (Get-FileHash package.json -Algorithm SHA256).Hash
          if ($after -ne $env:manifest_hash) {
            throw "package.json changed during the build."
          }

      - name: Ensure GitHub release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseTitle = "${{ steps.version.outputs.version }}"
            if ($tag -eq "v4.1.0") { $releaseTitle = "4.1.0 - Private Scouting & Tryouts" }
            if ($tag -eq "v3.0.15") { $releaseTitle = "3.0.15 - Stats Import and Saved Bench Zones" }
            if ($tag -eq "v3.1.0") { $releaseTitle = "3.1.0 - Coach Command Center" }
            if ($tag -eq "v3.1.0-dev.1") { $releaseTitle = "3.1.0-dev.1 - Coach Command Center" }
            $releaseArgs = @("release", "create", $tag, "--repo", "${{ github.repository }}", "--title", $releaseTitle, "--notes-file", "RELEASE_${{ steps.version.outputs.version }}.md", "--draft")
            if ("${{ steps.version.outputs.version }}".Contains("-")) { $releaseArgs += "--prerelease" }
            gh @releaseArgs
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed." }
          } else {
            Write-Host "Release $tag already exists."
          }
          exit 0

      - name: Upload updater files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release upload $tag "dist/latest.yml" "dist/*.exe" "dist/*.blockmap" --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed." }
          $publishArgs = @("release", "edit", $tag, "--draft=false", "--repo", "${{ github.repository }}")
          if (-not "${{ steps.version.outputs.version }}".Contains("-")) { $publishArgs += "--latest" }
          gh @publishArgs
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }

      - name: Publish summary
        shell: pwsh
        run: |
          "### Arctic Foxes ${{ steps.version.outputs.version }} published ✅" >> $env:GITHUB_STEP_SUMMARY
          "The Windows installer, blockmap, and latest.yml were uploaded by GitHub Actions." >> $env:GITHUB_STEP_SUMMARY
